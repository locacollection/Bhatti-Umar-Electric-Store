name: Deploy Bhatti Electric Store
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bhatti-github-pages-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BHATTI_ORDER_UI_VERSION: 20261004-orders-mobile-6
  BHATTI_MOBILE_POLISH_VERSION: 20261004-mobile-polish-2
  BHATTI_ARCHIVE_DELETE_VERSION: 20261004-archive-delete-1
  BHATTI_ORDER_COUNT_FIX_VERSION: 20261004-order-count-2
  BHATTI_NO_AUTOFOCUS_VERSION: 20261004-no-autofocus-1
  BHATTI_STUDIO_PATH_REPAIR_VERSION: 20261004-path-repair-1
  BHATTI_ORDER_CATALOGUE_REPAIR_VERSION: 20261004-order-catalogue-repair-2

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend
        run: node tests/runtime-smoke.cjs

      - name: Inject canonical mobile admin UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [Path('frontend/admin/index.html'), Path('frontend/super-admin.html')]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              prefix = '../' if path.parent.name == 'admin' else ''
              focus_tag = f'<script src="{prefix}scripts/admin/no-autofocus.js?v=20261004-no-autofocus-1"></script>'
              archive_delete_tag = f'<script src="{prefix}scripts/admin/archive-delete-guard.js?v=20261004-archive-delete-1"></script>'
              order_tag = f'<script src="{prefix}scripts/admin/orders-mobile.js?v=20261004-orders-mobile-6"></script>'
              polish_tag = f'<script src="{prefix}scripts/admin/mobile-polish.js?v=20261004-mobile-polish-2"></script>'
              order_count_fix_tag = f'<script src="{prefix}scripts/admin/orders-render-fix.js?v=20261004-order-count-2"></script>'
              repair_tag = f'<script src="{prefix}scripts/admin/studio-path-repair.js?v=20261004-path-repair-1"></script>'
              order_catalogue_repair_tag = f'<script src="{prefix}scripts/admin/orders-catalogue-repair.js?v=20261004-order-catalogue-repair-2"></script>'
              order_count_boot_style = '<style id="bhatti-order-count-boot">#orderCount{visibility:hidden!important}</style>'
              text = re.sub(r'<script[^>]+scripts/admin/no-autofocus\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/orders-mobile-v2\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/orders-mobile\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/mobile-polish\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/orders-render-fix\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/studio-path-repair\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/orders-catalogue-repair\\.js[^>]*></script>\\s*', '', text)
              text = text.replace('</head>', focus_tag + archive_delete_tag + order_count_boot_style + '</head>', 1)
              text = text.replace('</body>', order_tag + polish_tag + order_count_fix_tag + repair_tag + order_catalogue_repair_tag + '</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

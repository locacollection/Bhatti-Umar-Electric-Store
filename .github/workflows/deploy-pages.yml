name: Deploy Bhatti Electric Store
on:
  push:
    branches: [main]
  workflow_dispatch:

# One Pages deployment at a time for the main storefront.
# A newer run cancels an older in-progress deployment instead of
# leaving GitHub Pages blocked by a stale deployment.
# Re-deploy reverted main state.
# Account UI deployment trigger: 2026-09-28
concurrency:
  group: bhatti-github-pages-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend
        run: node tests/runtime-smoke.cjs

      - name: Inject mobile order UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [Path('frontend/admin/index.html'), Path('frontend/super-admin.html')]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              marker = 'scripts/admin/orders-mobile.js'
              if marker not in text:
                  tag = '<script src="' + ('../' if path.parts[-2] == 'admin' else '') + 'scripts/admin/orders-mobile.js?v=20261003-orders-mobile-1"></script>'
                  text = text.replace('</body>', tag + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

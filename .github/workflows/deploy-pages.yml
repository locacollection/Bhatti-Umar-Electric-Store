name: Deploy Bhatti Electric Store
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bhatti-github-pages-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BHATTI_ORDER_UI_VERSION: 20261004-orders-mobile-5

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend
        run: node tests/runtime-smoke.cjs

      - name: Inject canonical mobile order UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [Path('frontend/admin/index.html'), Path('frontend/super-admin.html')]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              prefix = '../' if path.parent.name == 'admin' else ''
              tag = f'<script src="{prefix}scripts/admin/orders-mobile.js?v=20261004-orders-mobile-5"></script>'
              text = re.sub(r'<script[^>]+scripts/admin/orders-mobile-v2\\.js[^>]*></script>\\s*', '', text)
              text = re.sub(r'<script[^>]+scripts/admin/orders-mobile\\.js[^>]*></script>\\s*', '', text)
              text = text.replace('</body>', tag + '</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
